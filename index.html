<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center | ForRealScan</title>

    <!-- Inter Tight Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            /* ForRealScan Color System */
            --veritas: hsl(142, 76%, 36%);
            --veritas-glow: hsl(142, 76%, 45%);
            --veritas-rgb: 34, 197, 94;

            --robo: hsl(210, 100%, 56%);
            --robo-glow: hsl(210, 100%, 65%);
            --robo-rgb: 59, 130, 246;

            /* Backgrounds */
            --bg-primary: #0c0f1e;
            --bg-secondary: #111827;
            --bg-tertiary: rgba(255, 255, 255, 0.05);
            --bg-card: rgba(17, 24, 39, 0.8);

            /* Text */
            --text-primary: #f8fafc;
            --text-muted: hsl(215, 20%, 65%);

            /* Glass Effect */
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-hover: rgba(255, 255, 255, 0.15);

            /* Shadows */
            --shadow-veritas: 0 0 25px rgba(var(--veritas-rgb), 0.25);
            --shadow-robo: 0 0 25px rgba(var(--robo-rgb), 0.25);
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.5);

            /* Spacing & Radius */
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-2xl: 2rem;

            /* Easing */
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes gradient-flow {
            0% { background-position: 0% center; }
            50% { background-position: 100% center; }
            100% { background-position: 0% center; }
        }

        /* ===== BASE STYLES ===== */
        body {
            font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Dot Pattern Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== GLOW ORBS ===== */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: pulse-glow 8s ease-in-out infinite;
            z-index: 0;
        }

        .glow-orb-veritas {
            width: 400px;
            height: 400px;
            background: var(--veritas);
            top: -100px;
            left: -100px;
            opacity: 0.15;
        }

        .glow-orb-robo {
            width: 350px;
            height: 350px;
            background: var(--robo);
            bottom: -50px;
            right: -100px;
            opacity: 0.12;
            animation-delay: 3s;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            position: relative;
            z-index: 1;
            animation: fade-in-up 0.6s ease-out;
        }

        /* ===== HEADER ===== */
        header {
            text-align: center;
            animation: float 6s ease-in-out infinite;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-img {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(var(--veritas-rgb), 0.3));
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 30px rgba(var(--veritas-rgb), 0.5));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--veritas) 0%, var(--robo) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            margin-top: 0.25rem;
        }

        /* ===== GAME CARDS ===== */
        .game-cards {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 500px;
            width: 100%;
        }

        .game-card {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 1.25rem;
            padding: 1.5rem;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-xl);
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s var(--ease-smooth);
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: var(--glass-border-hover);
        }

        .game-card-realai:hover {
            border-color: var(--veritas);
            box-shadow: var(--shadow-veritas);
        }

        .game-card-memory:hover {
            border-color: var(--robo);
            box-shadow: var(--shadow-robo);
        }

        .card-icon {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: var(--radius-lg);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .card-action {
            display: flex;
            align-items: center;
        }

        .play-btn {
            padding: 0.5rem 1rem;
            background: linear-gradient(135deg, var(--veritas), var(--robo));
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            color: white;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
            margin: 0.5rem 0;
        }

        /* ===== FOOTER ===== */
        .footer-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
            opacity: 0.8;
        }

        .footer-link:hover {
            color: var(--veritas);
            opacity: 1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .game-card {
                grid-template-columns: auto 1fr;
                grid-template-rows: auto auto;
            }

            .card-action {
                grid-column: 1 / -1;
                justify-self: stretch;
            }

            .play-btn {
                display: block;
                text-align: center;
                padding: 0.75rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .logo-img {
                width: 80px;
            }

            .card-icon {
                width: 50px;
                height: 50px;
                font-size: 2rem;
            }

            .card-title {
                font-size: 1.1rem;
            }

            .card-desc {
                font-size: 0.8rem;
            }
        }
        /* ===== LANGUAGE SWITCHER ===== */
        .language-switcher {
            display: flex;
            gap: 0.25rem;
            padding: 0.25rem;
            background: var(--glass-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
        }

        .lang-btn {
            padding: 0.4rem 0.6rem;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .lang-btn.active {
            color: var(--text-primary);
            background: linear-gradient(135deg, var(--veritas), var(--robo));
        }

        .top-bar {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10;
        }
    </style>
</head>

<body>
    <script>
        // ===== TRANSLATIONS =====
        const TRANSLATIONS = {
            de: {
                hub_title: 'Game Center',
                hub_tagline: 'Trainiere deine KI-Erkennung',
                game_realai_title: 'Real or AI?',
                game_realai_desc: 'Erkenne ob Bilder echt oder KI-generiert sind. Schnell. Präzise.',
                game_memory_title: 'Memory Scan',
                game_memory_desc: 'Finde Paare und sortiere sie in Real oder KI.',
                btn_play: 'Spielen →',
            },
            en: {
                hub_title: 'Game Center',
                hub_tagline: 'Train your AI detection skills',
                game_realai_title: 'Real or AI?',
                game_realai_desc: 'Detect if images are real or AI-generated. Fast. Precise.',
                game_memory_title: 'Memory Scan',
                game_memory_desc: 'Find pairs and sort them into Real or AI.',
                btn_play: 'Play →',
            },
            it: {
                hub_title: 'Game Center',
                hub_tagline: 'Allena il tuo rilevamento IA',
                game_realai_title: 'Reale o IA?',
                game_realai_desc: 'Riconosci se le immagini sono reali o generate da IA. Veloce. Preciso.',
                game_memory_title: 'Memory Scan',
                game_memory_desc: 'Trova le coppie e ordinale in Reale o IA.',
                btn_play: 'Gioca →',
            },
            es: {
                hub_title: 'Game Center',
                hub_tagline: 'Entrena tu detección de IA',
                game_realai_title: '¿Real o IA?',
                game_realai_desc: 'Detecta si las imágenes son reales o generadas por IA. Rápido. Preciso.',
                game_memory_title: 'Memory Scan',
                game_memory_desc: 'Encuentra parejas y clasifícalas en Real o IA.',
                btn_play: 'Jugar →',
            },
            fr: {
                hub_title: 'Game Center',
                hub_tagline: 'Entraînez votre détection d\'IA',
                game_realai_title: 'Réel ou IA?',
                game_realai_desc: 'Détectez si les images sont réelles ou générées par IA. Rapide. Précis.',
                game_memory_title: 'Memory Scan',
                game_memory_desc: 'Trouvez des paires et triez-les en Réel ou IA.',
                btn_play: 'Jouer →',
            }
        };

        // ===== LANGUAGE SYSTEM =====
        function getLanguage() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlLang = urlParams.get('lang');
            if (urlLang && TRANSLATIONS[urlLang]) return urlLang;

            const savedLang = localStorage.getItem('forRealScan_language');
            if (savedLang && TRANSLATIONS[savedLang]) return savedLang;

            const browserLang = navigator.language.split('-')[0];
            if (TRANSLATIONS[browserLang]) return browserLang;

            return 'de';
        }

        let currentLang = getLanguage();

        function setLanguage(lang) {
            if (!TRANSLATIONS[lang]) return;
            currentLang = lang;
            localStorage.setItem('forRealScan_language', lang);
            applyTranslations();
        }

        function t(key) {
            return TRANSLATIONS[currentLang][key] || TRANSLATIONS['de'][key] || key;
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.textContent = t(key);
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                el.placeholder = t(key);
            });
        }
    </script>
    <!-- Language Switcher -->
    <div class="top-bar">
        <div class="language-switcher">
            <button class="lang-btn" data-lang="de">DE</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="it">IT</button>
            <button class="lang-btn" data-lang="es">ES</button>
            <button class="lang-btn" data-lang="fr">FR</button>
        </div>
    </div>

    <!-- Glow Orbs -->
    <div class="glow-orb glow-orb-veritas"></div>
    <div class="glow-orb glow-orb-robo"></div>

    <div class="container">
        <header>
            <div class="logo-container">
                <img src="Logo_Master-removebg-preview.png" alt="ForRealScan Logo" class="logo-img">
                <h1 data-i18n="hub_title">Game Center</h1>
                <p class="subtitle" data-i18n="hub_tagline">Trainiere deine KI-Erkennung</p>
            </div>
        </header>

        <nav class="game-cards">
            <a href="real-or-ai.html" class="game-card game-card-realai">
                <div class="card-icon">🎯</div>
                <div class="card-content">
                    <h2 class="card-title" data-i18n="game_realai_title">Real or AI?</h2>
                    <p class="card-desc" data-i18n="game_realai_desc">Erkenne ob Bilder echt oder KI-generiert sind. Schnell. Präzise.</p>
                </div>
                <div class="card-action">
                    <span class="play-btn" data-i18n="btn_play">Spielen →</span>
                </div>
            </a>

            <a href="memory.html" class="game-card game-card-memory">
                <div class="card-icon">🧠</div>
                <div class="card-content">
                    <h2 class="card-title" data-i18n="game_memory_title">Memory Scan</h2>
                    <p class="card-desc" data-i18n="game_memory_desc">Finde Paare und sortiere sie in Real oder KI.</p>
                </div>
                <div class="card-action">
                    <span class="play-btn" data-i18n="btn_play">Spielen →</span>
                </div>
            </a>
        </nav>

        <div class="divider"></div>

        <a href="https://forrealscan.com" target="_blank" class="footer-link">forrealscan.com</a>
    </div>

    <script>
        // ===== LANGUAGE INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            currentLang = getLanguage();

            // Mark active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === currentLang);
            });

            // Apply translations
            applyTranslations();
        });

        // Language Switcher Events
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                setLanguage(btn.dataset.lang);
            });
        });
    </script>
</body>

</html>
